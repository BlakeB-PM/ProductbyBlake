server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Share directly; keep all case-study URL variants out of search.
    location ~ ^/case-study(?:\.html|/)?$ {
        add_header X-Robots-Tag "noindex, nofollow" always;
        try_files /case-study.html =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
